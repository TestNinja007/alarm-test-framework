name: Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, so the suite runs against a fresh checkout of the application
    # even on days nothing here changed.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One job per engine rather than one job cycling through them. Three
      # browsers competing for one runner — and for the single Node process
      # they are all testing — made the slower engines time out. Separate jobs
      # also mean a WebKit failure is visible as a WebKit failure.
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alarm_app
          POSTGRES_PASSWORD: alarm_app
          POSTGRES_DB: alarm_configurator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alarm_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://127.0.0.1:8080
      DATABASE_URL: postgresql://alarm_app:alarm_app@127.0.0.1:5432/alarm_configurator

    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      # The application is a separate repository on purpose: the suite is
      # written against its published interface, not against internals it can
      # see. CI brings the two together only to run them.
      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: TestNinja007/alarm-configurator
          path: app
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Build the application
        working-directory: app
        run: |
          npm ci --include=dev
          npm run build

      - name: Start the application
        working-directory: app
        env:
          NODE_ENV: test
          PORT: 8080
          TEST_SUPPORT: '1'
          SEED_ON_START: always
          SEED_PROFILE: demo
          REGISTRATION_OPEN: '1'
          MAIL_TRANSPORT: capture
          TTS_PROVIDER: none
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          LOG_LEVEL: warn
        run: |
          node src/api/dist/boot.js > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/v1/health" > /dev/null 2>&1; then
              echo "Ready after ${i}s."
              curl -fsS "$BASE_URL/api/v1/health"
              exit 0
            fi
            sleep 1
          done
          echo "The application never became ready. Its log:"
          cat app.log
          exit 1

      - name: Install the framework
        run: npm ci

      - name: Install the browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}

      # Two passes within the job. Pinning the clock is server-wide state, so
      # anything that pins time runs alone; everything else runs in parallel.
      # --pass-with-no-tests on both: a project may legitimately have none
      # of one kind. Only the API specs pin the clock today, so without it
      # the serial pass failed every browser job for finding nothing to run.
      # The browser projects run one worker. Above that, operations stall for
      # exactly 10s at a time while the application stays healthy -- measured,
      # and written up in playwright.config.ts. The cap was two until the UI
      # suite reached eighteen specs, at which point two stopped holding: the
      # limit tracks total concurrent browser work, not the worker count. One
      # worker runs the whole browser suite in about 24 seconds.
      - name: Run the parallel pass
        run: >-
          npx playwright test --project=${{ matrix.project }}
          --grep-invert @serial --pass-with-no-tests
          ${{ matrix.project != 'api' && '--workers=1' || '' }}
        env:
          REPORT_NAME: ${{ matrix.project }}-parallel

      - name: Run the serial pass
        if: always()
        run: npx playwright test --project=${{ matrix.project }} --grep @serial --workers=1 --pass-with-no-tests
        env:
          REPORT_NAME: ${{ matrix.project }}-serial

      - name: Put the results on the run page
        if: always()
        run: npx tsx src/summary.ts test-results/results.json "${{ matrix.project }}"

      - name: Upload this job's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 14

      - name: Upload the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log-${{ matrix.project }}
          path: app.log
          retention-days: 14

      - name: Stop the application
        if: always()
        run: kill "$(cat app.pid)" || true

  # One report from four jobs, published where someone will read it.
  #
  # The per-job artifacts were zips: to see whether WebKit passed you had to
  # open Actions, find the run, download a zip and open it locally. Merging the
  # blobs into a single HTML report and putting it on Pages makes that one
  # click, and keeps every engine's result in one place.
  # The database layer, in its own stack and its own job.
  #
  # Separate from `suite` rather than a fifth entry in its matrix: it needs no
  # browser and no Node, it is finished in seconds, and a failure here means
  # something quite different from a failing UI spec - the rows are wrong
  # rather than the screen is. See CLAUDE.md on why there are two stacks.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alarm_app
          POSTGRES_PASSWORD: alarm_app
          POSTGRES_DB: alarm_configurator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alarm_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://127.0.0.1:8080
      DATABASE_URL: postgresql://alarm_app:alarm_app@127.0.0.1:5432/alarm_configurator

    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: TestNinja007/alarm-configurator
          path: app
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: database/requirements.txt

      - name: Build the application
        working-directory: app
        run: |
          npm ci --include=dev
          npm run build

      - name: Apply the migrations
        working-directory: app
        run: npm run migrate

      - name: Start the application
        working-directory: app
        env:
          NODE_ENV: test
          PORT: 8080
          TEST_SUPPORT: '1'
          SEED_ON_START: always
          SEED_PROFILE: demo
          REGISTRATION_OPEN: '1'
          MAIL_TRANSPORT: capture
          TTS_PROVIDER: none
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          LOG_LEVEL: warn
        run: |
          node src/api/dist/boot.js > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/v1/health" > /dev/null 2>&1; then
              echo "Ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "The application never became ready. Its log:"
          cat app.log
          exit 1

      - name: Install the database layer
        run: python -m pip install -r database/requirements.txt

      # Four of these tests act through the interface before looking at rows,
      # because alarm_drafts and ui_state are written by the browser and no
      # API call reproduces that. Chromium only - this job is not the
      # cross-engine matrix, it is the database.
      - name: Install Chromium for the interface-driven tests
        run: python -m playwright install --with-deps chromium

      # These tests skip themselves without DATABASE_URL, which is right
      # locally and wrong here: in CI a missing database is a broken workflow,
      # not a configuration choice, and skipping would make it look green.
      - name: Refuse to pass by skipping
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is unset in CI."; exit 1; }

      - name: Run the database layer
        working-directory: database
        run: python -m pytest tests -v --junit-xml=../database-results.xml

      - name: Put the results on the run page
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = 'database-results.xml'
          if not os.path.exists(path):
              raise SystemExit(0)
          suite = ET.parse(path).getroot().find('testsuite') or ET.parse(path).getroot()
          total = int(suite.get('tests', 0))
          failed = int(suite.get('failures', 0)) + int(suite.get('errors', 0))
          skipped = int(suite.get('skipped', 0))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          verdict = 'All passing' if failed == 0 else f'{failed} failing'
          lines = [
              '### database layer',
              '',
              f'{verdict} - {total} tests, {skipped} skipped.',
              '',
          ]
          if failed:
              lines.append('| Test | Why |')
              lines.append('| --- | --- |')
              for case in suite.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      why = (bad.get('message') or '').strip().splitlines()[:1]
                      lines.append(f"| `{case.get('name')}` | {(why[0] if why else '')[:140]} |")
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log-database
          path: app.log
          retention-days: 7

  report:
    name: report
    if: always()
    needs: [suite, database]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    # Pages refuses concurrent deployments, and the workflow-level group
    # cancels in progress, which would abandon a half-finished deploy.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Collect every job's blob report
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # The blobs arrive one directory deep, since each pass writes into its
      # own to keep the next from clearing it. merge-reports wants them flat,
      # and the file names are already unique per pass.
      - name: Flatten the blobs
        run: |
          mkdir -p blobs
          find all-blob-reports -name '*.zip' -exec cp {} blobs/ \;
          echo "Merging:"; ls -1 blobs

      - name: Merge them into one HTML report
        run: npx playwright merge-reports --reporter html ./blobs

      - name: Keep the merged report as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Only from main. A pull request from a fork cannot deploy Pages, and a
      # branch's results are not the published ones.
      - name: Package it for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Publish
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
