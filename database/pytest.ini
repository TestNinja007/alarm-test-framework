[pytest]
# The Python world is self-contained in this directory so the two stacks do
# not argue about rootdir, config files or which "tests" is which.
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --tb=short
markers =
    cascade: referential integrity - what deleting a row takes with it
    storage: how a value is stored, as opposed to what the API returns
    recurrence: recurrence data as persisted by the engine
    smoke: the database layer's own plumbing
